<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5fd0'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>评委打分</title>
    <!-- {{BASE}} 由服务端在下发时替换成实际的口令前缀（src/pages.js） -->
    <script>
      window.PFXT_BASE = '{{BASE}}';
    </script>
    <link rel="stylesheet" href="{{BASE}}/common.css" />
    <link rel="stylesheet" href="{{BASE}}/vote.css" />
  </head>
  <body>
    <div class="vote-shell">
      <!-- 加载中 -->
      <section id="screen-loading" class="screen">
        <div class="center-state">
          <div class="spinner"></div>
          <p>正在加载…</p>
        </div>
      </section>

      <!-- 阻断态：登录码无效 / 已作废 / 投票已结束 -->
      <section id="screen-blocked" class="screen" hidden>
        <div class="center-state">
          <div class="big-icon" id="blocked-icon">⚠️</div>
          <h2 id="blocked-title"></h2>
          <p id="blocked-desc"></p>
          <a class="btn btn-primary" id="blocked-action" href="{{BASE}}/v" hidden>重新输入登录码</a>
        </div>
      </section>

      <!-- 等待主持人开始下一位 -->
      <section id="screen-waiting" class="screen" hidden>
        <div class="center-state">
          <div class="wait-pulse"></div>
          <h2 id="waiting-title">等待主持人开始下一位</h2>
          <p id="waiting-desc">当前没有正在进行的演讲者。页面会自动刷新，不用手动操作。</p>
        </div>
      </section>

      <!-- 打分页：**只有当前这一位演讲者** -->
      <section id="screen-score" class="screen" hidden>
        <header class="round-head">
          <span class="round-badge" id="round-badge"></span>
          <h1 class="round-name" id="round-name"></h1>
          <p class="round-project" id="round-project"></p>
        </header>

        <div class="card">
          <div class="card-head" id="round-intro-wrap" hidden>
            <p class="card-intro" id="round-intro"></p>
          </div>
          <div id="dim-host"></div>
        </div>

        <div class="submit-bar">
          <p class="hint" id="score-hint"></p>
          <button type="button" class="btn btn-primary btn-block" id="btn-submit" disabled>
            提交本场评分
          </button>
          <p class="hint hint-center">
            <strong>提交后不可修改</strong>，且看不到其他演讲者的任何信息。
          </p>
        </div>
      </section>

      <!-- 本场已提交，等待下一位 -->
      <section id="screen-submitted" class="screen" hidden>
        <div class="done-head">
          <div class="done-check">✓</div>
          <h1>本场已提交</h1>
          <p id="submitted-desc">评分已匿名记录，<strong>不可修改</strong>。</p>
        </div>
        <div class="center-state center-state-tight">
          <div class="wait-pulse"></div>
          <p>等待主持人开始下一位。页面会自动刷新。</p>
        </div>
      </section>
    </div>

    <div id="modal-root"></div>

    <script src="{{BASE}}/vote.js"></script>
  </body>
</html>
