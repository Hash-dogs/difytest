<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5fd0'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>进入评分</title>
    <!-- {{BASE}} 由服务端在下发时替换成实际的口令前缀（src/pages.js）。
         必须写成绝对路径 + 前缀：`/v/:code` 这类深层路径下相对路径会算错目录。 -->
    <script>
      window.PFXT_BASE = '{{BASE}}';
    </script>
    <link rel="stylesheet" href="{{BASE}}/common.css" />
    <link rel="stylesheet" href="{{BASE}}/vote.css" />
  </head>
  <body>
    <div class="vote-shell">
      <!-- 已经登录过（localStorage 里有码）→ 校验期间显示这个 -->
      <section id="screen-loading" class="screen">
        <div class="center-state">
          <div class="spinner"></div>
          <p>正在进入…</p>
        </div>
      </section>

      <!-- 短码输入 -->
      <section id="screen-code" class="screen" hidden>
        <div class="code-box">
          <p class="eyebrow">评委打分</p>
          <h1 class="code-title">请输入登录码</h1>
          <p class="code-desc">
            主持人发给你的那串字符，通常是一串 8 位大写字母和数字。
          </p>

          <input
            id="code-input"
            class="input code-input"
            type="text"
            inputmode="latin"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            maxlength="16"
            placeholder="例如 7K2M9Q4A"
            aria-label="登录码"
          />

          <p class="code-error" id="code-error" hidden></p>

          <button type="button" class="btn btn-primary btn-block" id="btn-login">开始评分</button>

          <p class="hint hint-center">
            没有登录码？请向主持人索取。<br />
            每位评委一个码，不要转给别人。
          </p>
        </div>
      </section>
    </div>

    <script>
      /**
       * 统一入口页（PLAN §7.1）。
       *
       * ⚠️ 2026-09-18 语义变更：这里**不再自动签发新码**。
       *    旧版扫码后由服务器当场发码，谁扫谁有份；现在必须输入
       *    管理员一对一发放的登录码 —— 短码因此从「随机标识」变成了凭据。
       *
       * 短码同时存在 URL 与 localStorage 两处（PLAN §7.3）：
       * 企业微信内置浏览器与系统浏览器是两个独立存储域，
       * 且企微有概率清掉 localStorage，所以两处都要能兜住。
       */
      (function () {
        var KEY = 'pfxt:code';
        var BASE = window.PFXT_BASE || '';

        var loading = document.getElementById('screen-loading');
        var codeScreen = document.getElementById('screen-code');
        var input = document.getElementById('code-input');
        var errBox = document.getElementById('code-error');
        var btn = document.getElementById('btn-login');

        function lsGet() {
          try {
            return localStorage.getItem(KEY) || '';
          } catch (e) {
            return '';
          }
        }

        function lsSet(v) {
          try {
            localStorage.setItem(KEY, v);
          } catch (e) {
            /* 写不进去也能继续，只是下次要重新输一遍 */
          }
        }

        function showCodeScreen(message) {
          loading.hidden = true;
          codeScreen.hidden = false;
          if (message) {
            errBox.textContent = message;
            errBox.hidden = false;
          }
          input.focus();
        }

        function normalize(raw) {
          return String(raw || '')
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, '');
        }

        function submit(raw) {
          var code = normalize(raw);
          if (code.length < 4) {
            errBox.textContent = '登录码看起来不完整，请核对后再试。';
            errBox.hidden = false;
            return;
          }

          btn.disabled = true;
          errBox.hidden = true;

          fetch(BASE + '/api/v/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: code }),
          })
            .then(function (r) {
              return r.json().then(function (d) {
                return d || {};
              });
            })
            .then(function (data) {
              btn.disabled = false;
              if (!data.ok) {
                errBox.textContent = data.message || '登录码不正确，请核对。';
                errBox.hidden = false;
                return;
              }
              lsSet(data.code);
              location.replace(BASE + '/v/' + encodeURIComponent(data.code));
            })
            .catch(function () {
              btn.disabled = false;
              errBox.textContent = '连不上服务器，请检查网络后重试。';
              errBox.hidden = false;
            });
        }

        btn.addEventListener('click', function () {
          submit(input.value);
        });

        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') submit(input.value);
        });

        // 输入时自动转大写，让人一眼看出打对没有
        input.addEventListener('input', function () {
          var at = input.selectionStart;
          input.value = input.value.toUpperCase();
          input.setSelectionRange(at, at);
        });

        // 之前登录过就直接进去，不用再输一遍
        var saved = lsGet();
        if (saved) submit(saved);
        else showCodeScreen();
      })();
    </script>
  </body>
</html>
