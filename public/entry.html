<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5fd0'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>进入评分</title>
    <link rel="stylesheet" href="/common.css" />
    <link rel="stylesheet" href="/vote.css" />
  </head>
  <body>
    <div class="vote-shell">
      <div class="center-state">
        <div class="spinner" id="entry-spinner"></div>
        <p id="entry-msg">正在进入评分页面…</p>
        <button type="button" class="btn btn-primary" id="entry-retry" hidden>重试</button>
      </div>
    </div>

    <script>
      /**
       * 固定入口引导页。
       * 本浏览器已经有 token 就复用（避免重复领、重复投票），
       * 没有才向服务器领一个新的，然后跳到自己的评分页。
       */
      (function () {
        var KEY = 'pfxt:token';
        var spinner = document.getElementById('entry-spinner');
        var msg = document.getElementById('entry-msg');
        var retry = document.getElementById('entry-retry');

        function readToken() {
          try {
            return localStorage.getItem(KEY);
          } catch (e) {
            return null; // 隐私模式下会抛异常，当作没有
          }
        }

        function writeToken(t) {
          try {
            localStorage.setItem(KEY, t);
          } catch (e) {
            /* 写不进去也能继续，只是下次要重新领 */
          }
        }

        function fail(text) {
          spinner.hidden = true;
          msg.textContent = text;
          retry.hidden = false;
        }

        function claim() {
          fetch('/api/v/claim', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: readToken() || undefined }),
          })
            .then(function (r) {
              return r.json().then(function (d) {
                return { status: r.status, data: d };
              });
            })
            .then(function (res) {
              var data = res.data || {};
              if (!data.ok || !data.code) {
                if (data.error === 'closed') return fail('本次投票已经结束，无法进入评分页面。');
                if (data.error === 'too_many_claims') return fail('领取过于频繁，请稍等一会儿再试。');
                return fail(data.message || '无法进入评分页面，请联系组织者。');
              }
              writeToken(data.code);
              location.replace('/v/' + encodeURIComponent(data.code));
            })
            .catch(function () {
              fail('连不上服务器。请确认手机和电脑连的是同一个 WiFi，然后重试。');
            });
        }

        retry.addEventListener('click', function () {
          retry.hidden = true;
          spinner.hidden = false;
          msg.textContent = '正在进入评分页面…';
          claim();
        });

        claim();
      })();
    </script>
  </body>
</html>
